name: Refresh Idaho Base v1 completion

on:
  schedule:
    - cron: "0 16 4 * *" # 4th of each month, after trails/foundation/context
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "scripts/pull_idaho_base_v1_completion.py"
      - "scripts/package_large_geojson.py"
      - ".github/workflows/refresh-base-v1.yml"

concurrency:
  group: refresh-idaho-base-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geospatial dependency
        run: python -m pip install "shapely>=2.0,<3"
      - name: Pull final Base v1 sources
        run: python scripts/pull_idaho_base_v1_completion.py
      - name: Package oversized GeoJSON
        run: python scripts/package_large_geojson.py
      - name: Validate generated data
        run: python scripts/validate_data.py
      - name: Commit if changed
        run: |
          git config user.name "map-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/boundaries/ data/access/
          git diff --staged --quiet || git commit -m "Auto-refresh Idaho Base v1 ($(date +%F))"
          git pull --rebase origin main
          git push
