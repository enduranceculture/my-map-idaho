name: Refresh USFS trail data

on:
  schedule:
    - cron: "0 15 1 * *" # 1st of each month, 8am MT
  workflow_dispatch: {} # allow manual runs from the Actions tab
  push:
    branches:
      - main
    paths:
      - "scripts/pull_usfs_trails.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull latest USFS data
        run: python scripts/pull_usfs_trails.py
      - name: Commit if changed
        run: |
          git config user.name "map-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Auto-refresh USFS trail data ($(date +%F))"
          # Another map-layer job or manual edit can land while this refresh runs.
          # Rebase the generated data commit before pushing so parallel work is preserved.
          git pull --rebase origin main
          git push
