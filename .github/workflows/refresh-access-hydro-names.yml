name: Refresh Idaho access hydro and names

on:
  schedule:
    - cron: "0 16 3 * *" # 3rd of each month, staggered after trails/foundation
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "scripts/pull_idaho_access_hydro_names.py"
      - ".github/workflows/refresh-access-hydro-names.yml"

concurrency:
  group: refresh-idaho-access-hydro-names
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geospatial dependency
        run: python -m pip install "shapely>=2.0,<3"
      - name: Pull Idaho access hydro and names
        run: python scripts/pull_idaho_access_hydro_names.py
      - name: Commit if changed
        run: |
          git config user.name "map-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/access/ data/hydro/ data/places/
          git diff --staged --quiet || git commit -m "Auto-refresh Idaho access hydro names ($(date +%F))"
          # Preserve any manual or parallel map-data changes that landed during the run.
          git pull --rebase origin main
          git push
