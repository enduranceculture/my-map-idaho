name: Refresh Idaho foundation data

on:
  schedule:
    - cron: "30 15 2 * *" # 2nd of each month, 8:30am MT during MDT
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "scripts/pull_idaho_foundation.py"
      - ".github/workflows/refresh-foundation.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geospatial dependency
        run: python -m pip install "shapely>=2.0,<3"
      - name: Pull and clip authoritative Idaho layers
        run: python scripts/pull_idaho_foundation.py
      - name: Commit if changed
        run: |
          git config user.name "map-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/boundaries/ data/old-growth/
          git diff --staged --quiet || git commit -m "Auto-refresh Idaho foundation data ($(date +%F))"
          git push
